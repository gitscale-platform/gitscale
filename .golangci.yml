# GitScale golangci-lint configuration.
# See https://golangci-lint.run/usage/configuration/

run:
  # Use the Go version declared in go.mod.
  go: "1.23"
  timeout: 5m

linters:
  # Start from the default set and add/remove explicitly.
  # typecheck is disabled: the golangci-lint embedded Go version (1.25) cannot
  # compile crypto/chacha20poly1305 which requires go1.26 on this system.
  # All type correctness is validated by `go build` and `go test` which use
  # the system Go (1.26+). See CI workflow for the canonical build check.
  enable-all: false
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - typecheck

linters-settings:
  govet:
    enable-all: false

issues:
  # Exclude typecheck errors caused by Go toolchain version skew.
  # golangci-lint's embedded Go (1.25) cannot compile crypto/chacha20poly1305
  # (requires go1.26), causing cascade "undefined" failures in pgx, redis, and
  # our source files. All type correctness is validated by `go build` and
  # `go test` which use the system Go (1.26+). See CI workflow.
  #
  # Using top-level `exclude` (regex matched against full issue text) because
  # golangci-lint v1.64 routes typecheck issues through a separate pipeline
  # that bypasses `exclude-rules` linter filtering.
  exclude:
    - "undefined: pgx"
    - "undefined: redis"
    - "undefined: codes"
    - "undefined: grpc"
    - "file requires newer Go version"
    - "application built with go1\\.25"

  exclude-rules:
    - path: "(.+)/pkg/mod/"
      linters: [typecheck]
    - path: "vendor/"
      linters: [typecheck]
    - path: "usr/lib/golang"
      linters: [typecheck]
    # Suppress nolint comments we've added deliberately.
    - linters: [nolintlint]
      text: "nolint"

  # Treat issues in third-party module paths as non-errors.
  exclude-dirs:
    - ".*pkg/mod.*"

  max-issues-per-linter: 0
  max-same-issues: 0
